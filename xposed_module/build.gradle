plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kycbypasser.xposed'
    compileSdk 26
    defaultConfig { minSdk 21; targetSdk 26; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies {
    // Xposed API — provided at runtime by VirtualXposed / LSPosed
    provided 'de.robv.android.xposed:api:82'
    provided 'de.robv.android.xposed:common:82'
}
